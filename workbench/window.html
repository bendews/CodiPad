<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=overlays-content">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="{{STYLESHEET}}">
<style>html,body{width:var(--codipad-native-viewport-width,100%);height:var(--codipad-native-viewport-height,100%);margin:0;overflow:hidden;touch-action:manipulation;background:#1f1f1f;color:#ddd}#codipad-workbench-host{position:relative;width:100%;height:var(--codipad-native-viewport-height,100%);overflow:hidden}</style>
<script>
// WKWebView can retain a stale document viewport after keyboard or window resizing.
// The native host reports its measured frame and the workbench observes that size.
let codipadViewportHeight, codipadViewportWidth, codipadViewportFrame;
window.__codipadSetNativeViewport = function(height, width) {
  if (!Number.isFinite(height) || height <= 0) return;
  codipadViewportHeight = height;
  if (Number.isFinite(width) && width > 0) codipadViewportWidth = width;
  if (codipadViewportFrame !== undefined) return;
  codipadViewportFrame = requestAnimationFrame(() => {
    codipadViewportFrame = undefined;
    document.documentElement.style.setProperty('--codipad-native-viewport-height', `${codipadViewportHeight}px`);
    if (codipadViewportWidth !== undefined) document.documentElement.style.setProperty('--codipad-native-viewport-width', `${codipadViewportWidth}px`);
    window.dispatchEvent(new Event('codipad-native-viewport'));
  });
};
const originalConsoleError = console.error.bind(console);
console.error = function(...args) {
  originalConsoleError(...args);
  try {
    window.webkit?.messageHandlers?.codipad?.postMessage({event:'workbench.consoleError',message:args.map(value => typeof value === 'string' ? value : value?.message || String(value)).join(' ')});
  } catch { /* Logging cannot replace the original application error. */ }
};
addEventListener('error', function(event) {
  const message = {event:'workbench.pageError',message:event.message || 'Asset failed',stack:event.error?.stack || '',asset:event.target?.src || ''};
  window.webkit?.messageHandlers?.codipad?.postMessage(message);
  if (!document.querySelector('.monaco-workbench')) {
    const panel = document.getElementById('startup'); if(panel) panel.textContent = message.message;
  }
},true);
addEventListener('unhandledrejection', function(event) {
  window.webkit?.messageHandlers?.codipad?.postMessage({event:'workbench.unhandledRejection',message:String(event.reason),stack:event.reason?.stack || ''});
});
</script>
</head><body><div id="codipad-workbench-host"><div id="startup" style="padding:20px;font:13px monospace">Starting CodiPad…</div></div>
<script src="configuration.js"></script>{{ENTRY_SCRIPT}}
</body></html>
